services:
  gateway:
    image: ${NGINX_IMAGE:?NGINX_IMAGE is required}
    pull_policy: never
    restart: unless-stopped
    depends_on:
      synapse:
        condition: service_healthy
    ports:
      - "${AXON_BIND_IP}:${AXON_CLIENT_PORT:-80}:80"
    volumes:
      - type: bind
        source: ${AXON_DATA_ROOT}/runtime/nginx/default.conf
        target: /etc/nginx/conf.d/default.conf
        read_only: true
    read_only: true
    tmpfs:
      - /var/cache/nginx
      - /var/run
      - /tmp
    security_opt:
      - no-new-privileges:true
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "-", "http://127.0.0.1/axon-health"]
      interval: 10s
      timeout: 3s
      retries: 6
      start_period: 5s
    networks:
      - axon_internal
      - axon_ingress

  synapse:
    image: ${SYNAPSE_IMAGE:?SYNAPSE_IMAGE is required}
    pull_policy: never
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      SYNAPSE_CONFIG_PATH: /config/homeserver.yaml
      UID: 991
      GID: 991
    ports:
      - "${AXON_CONTROL_BIND_IP:-127.0.0.1}:${AXON_SYNAPSE_ADMIN_PORT:-8008}:8008"
    volumes:
      - axon_synapse:/data
      - type: bind
        source: ${AXON_DATA_ROOT}/runtime/synapse/homeserver.yaml
        target: /config/homeserver.yaml
        read_only: true
    security_opt:
      - no-new-privileges:true
    healthcheck:
      test: ["CMD", "curl", "-fSs", "http://127.0.0.1:8008/health"]
      interval: 10s
      timeout: 3s
      retries: 12
      start_period: 30s
    networks:
      - axon_internal
      - axon_control

  postgres:
    image: ${POSTGRES_IMAGE:?POSTGRES_IMAGE is required}
    pull_policy: never
    restart: unless-stopped
    environment:
      POSTGRES_DB: synapse
      POSTGRES_USER: synapse
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}
      POSTGRES_INITDB_ARGS: --encoding=UTF8 --locale=C
    volumes:
      - axon_postgres:/var/lib/postgresql
    security_opt:
      - no-new-privileges:true
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U synapse -d synapse"]
      interval: 10s
      timeout: 3s
      retries: 12
      start_period: 10s
    networks:
      - axon_internal

networks:
  axon_internal:
    internal: true
  axon_control:
  axon_ingress:

volumes:
  axon_postgres:
  axon_synapse:
